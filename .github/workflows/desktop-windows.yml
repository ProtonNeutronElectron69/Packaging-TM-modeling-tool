# Builds the Windows desktop app (portable .exe, no installer) from the committed page in dist/.
# Every merge to main that changes the app (the built page, desktop/ or this file) also publishes
# a GitHub release automatically: the next patch version after the latest desktop-v* tag, or the
# version in desktop/package.json when that was raised on purpose (tools/desktop-version.mjs).
# A manual run (Actions tab, Run workflow) builds only, or publishes the release tag it is given
# (for example desktop-v1.2.0), created on the commit the run builds or on release_target.
# Pull requests that touch desktop/ get a build as a check. The built files are always kept as
# the run's "fcbga-desktop-windows" artifact.
name: Desktop app (Windows)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (for example desktop-v1.0.0); leave empty for a build only'
        required: false
        default: ''
      release_target:
        description: 'Commit the new tag points at (default: the commit this run builds)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['dist/fcbga_thermomech_tool.html', 'desktop/**', 'tools/desktop-*.mjs', '.github/workflows/desktop-windows.yml']
  pull_request:
    paths: ['desktop/**', 'tools/desktop-*.mjs', '.github/workflows/desktop-windows.yml']

permissions:
  contents: write

# one release at a time, so two quick merges cannot pick the same version
concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags, to find the latest released version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Choose the release version
        id: version
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.release_tag != ''
        run: node ../tools/desktop-version.mjs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Build the portable app
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'  # no code-signing certificate: the app is unsigned
      - name: Check the compute process runs the page's code (plain Node, full Draft analysis with a helper process)
        run: node ../tools/desktop-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fcbga-desktop-windows
          path: |
            desktop/release/*.exe
          if-no-files-found: error
      - name: Publish the release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ inputs.release_target || github.sha }}
          name: FCBGA Screening Tool desktop app ${{ steps.version.outputs.version }} (Windows)
          generate_release_notes: true  # appends the pull requests merged since the previous release
          body: |
            Windows desktop app of the FCBGA Thermomechanical Screening Tool. The analysis runs in separate compute processes on the computer, so large meshes and many workers are bounded by its memory, not by a browser tab.

            - FCBGA-Screening-Tool-Portable-*.exe: download and run; nothing to install (it unpacks itself on each start, so it opens a few seconds slower).

            The app is not code-signed: on first start Windows SmartScreen shows "Windows protected your PC"; choose More info, then Run anyway.

            Screening tool. Results are approximate and intended for design comparison and trend studies, not sign-off.
          files: desktop/release/*.exe
