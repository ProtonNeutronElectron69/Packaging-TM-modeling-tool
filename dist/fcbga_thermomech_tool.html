    if (lid && c.lidFoot) {
      if (zc < lid.zAdhTop) return [{ group: G.lidadh, scale: 1, part: PART.LIDADH }];
      if (zc < lid.zLidBot) return [{ group: G.lid, scale: 1, part: PART.LID }];
      return [];
    }
    if (g.stiff && c.ring) {
      if (zc < g.stiff.zAdhTop) return [{ group: G.stiffadh, scale: 1, part: PART.STIFFADH }];
      if (zc < g.stiff.zTop) return [{ group: G.stiff, scale: 1, part: PART.STIFF }];
      return [];
    }
    if (c.fil && c.fil.inFootprint) {
      if (zc < g.zaf || zc < g.zaf + c.fil.h) return [{ group: G.uf, scale: 1, part: PART.UF_FILLET }];
    }
    return [];
  };
}

function presetParams(cfg, override) {
  const p = Object.assign({}, CONST.MESH_PRESETS[(override && override.preset) || cfg.mesh.preset || 'standard']);
  if (override) for (const k of ['hmin', 'hmax', 'cap']) if (override[k] != null) p[k] = override[k];
  return p;
}

/**
 * Build the package mesh at a fidelity preset, enlarging h_min and h_max
 * proportionally until the DOF estimate is under the cap (Section 5.2).
 */
function buildPackageMesh(cfg, override) {
  const t0 = nowMs();
  const g = deriveGeometry(cfg);
  const pre = presetParams(cfg, override);
  const fx = axisFeatures(g, 'x'), fy = axisFeatures(g, 'y');
  const mx = mergeFeatures(fx.feats, CONST.FEATURE_SNAP_TOL), my = mergeFeatures(fy.feats, CONST.FEATURE_SNAP_TOL);
  const zp = zPlanes(g);
  const { groups, G } = packageGroups(cfg, g);
  let hmin = pre.hmin, hmax = pre.hmax, mesh = null, scaled = false;
  for (let it = 0; it < CONST.CAP_MAX_ITER; it++) {
    const xs = gridLines(mx.lines, fx.edges, hmin, hmax, fx.spans);
    const ys = gridLines(my.lines, fy.edges, hmin, hmax, fy.spans);
    const assign = makePackageAssign(g, xs, ys, zp.zs, G, zp.layerBand);
    mesh = buildStructuredMesh(xs, ys, zp.zs, groups, assign);
    const dof = 3 * mesh.nn;
    if (dof <= pre.cap || override && override.noCap) break;
    const f = Math.sqrt(dof / pre.cap) * CONST.CAP_GROWTH_PAD;
    hmin *= f; hmax *= f; scaled = true;
  }
  mesh.layerBand = Int32Array.from(zp.layerBand);
  // indices of the in-plane feature lines (kept at every multigrid coarse level)
  // (structural lines only: die edges and lid foot or stiffener ring edges)
  const featIdx = (lines, labels, grid) => { const out = []; lines.forEach((v, q) => { if (!/ edge$|outer$|inner$/.test(labels[q]) || /substrate/.test(labels[q])) return; let best = -1, bd = Infinity; for (let i = 0; i < grid.length; i++) { const d = Math.abs(grid[i] - v); if (d < bd) { bd = d; best = i; } } if (bd < 1e-9) out.push(best); }); return Int32Array.from(out); };
  mesh.featureX = featIdx(mx.lines, mx.labels, mesh.xs); mesh.featureY = featIdx(my.lines, my.labels, mesh.ys);
  mesh.subBand = new Int32Array(zp.zs.length - 1).fill(-1);
  for (let k = 0; k + 1 < zp.zs.length; k++) {
    const zc = 0.5 * (zp.zs[k] + zp.zs[k + 1]);
    for (let b = 0; b < g.sub.bands.length; b++) if (zc > g.sub.bands[b].z0 && zc < g.sub.bands[b].z1) mesh.subBand[k] = b;
  }
  mesh.G = G;
  mesh.geom = g;
  mesh.constraints = constraints321(mesh, CONST.CONSTRAINT_SPAN * Math.min(g.substrate.x1, g.substrate.y1));
  // quality statistics
  let amax = 0, nwarn = 0;
  for (let e = 0; e < mesh.ne; e++) {
    const i = mesh.eIJK[3 * e], j = mesh.eIJK[3 * e + 1], k = mesh.eIJK[3 * e + 2];
    const hx = mesh.xs[i + 1] - mesh.xs[i], hy = mesh.ys[j + 1] - mesh.ys[j], hz = mesh.zs[k + 1] - mesh.zs[k];
    const a = Math.max(hx, hy, hz) / Math.min(hx, hy, hz);
    if (a > amax) amax = a;
    if (a > CONST.ASPECT_WARN) nwarn++;
  }
  mesh.info = {
    preset: pre.label, hmin, hmax, hminPreset: pre.hmin, hmaxPreset: pre.hmax, cap: pre.cap, scaled,
    snappedX: mx.snapped, snappedY: my.snapped, snappedZ: zp.snapped,
    nx: mesh.nx, ny: mesh.ny, nz: mesh.nz, nNodes: mesh.nn, nElem: mesh.ne, nDof: 3 * mesh.nn,
    aspectMax: amax, nAspectWarn: nwarn, planeLabels: zp.baseLabels, basePlanes: zp.basePlanes,
    buildMs: nowMs() - t0,
  };
  return mesh;
}

/** Mesh-dependent warnings appended to the validation list. */
function meshWarnings(mesh) {
  const w = [];
  const inf = mesh.info;
  if (inf.nAspectWarn > 0) w.push({ level: 'warning', text: inf.nAspectWarn + ' elements have aspect ratio above ' + CONST.ASPECT_WARN + ' (max ' + inf.aspectMax.toFixed(0) + '); thin layers are handled by the incompatible-mode element but check mesh sensitivity.' });
  if (inf.nDof > inf.cap) w.push({ level: 'warning', text: 'DOF ' + inf.nDof + ' above the ' + inf.preset + ' cap ' + inf.cap + '.' });
  if (inf.scaled) w.push({ level: 'info', text: 'Mesh sizes enlarged to h_min ' + inf.hmin.toFixed(3) + ' mm and h_max ' + inf.hmax.toFixed(3) + ' mm to stay under the ' + inf.preset + ' DOF cap.' });
  const sn = inf.snappedX.concat(inf.snappedY);
  if (sn.length) w.push({ level: 'info', text: sn.length + ' in-plane feature lines closer than 10 µm were merged (' + sn.slice(0, 3).map(s => s.a + ' / ' + s.b).join('; ') + (sn.length > 3 ? '; ...' : '') + ').' });
  return w;
}

// ===== Hex8 with Wilson-Taylor incompatible modes (Section 7.1) ===========
//
// u = sum_a N_a u_a + sum_i P_i alpha_i,  P_1 = 1 - xi^2, P_2 = 1 - eta^2,
// P_3 = 1 - zeta^2 (9 enhanced DOFs, three per mode). Taylor's modification:
// grad P = (det J0 / det J) J0^-1 grad_xi P with J0 the Jacobian at the element
// centre, so that int grad P dV = 0 and the patch test passes (Taylor,
// Beresford, Wilson 1976). The 33 x 33 matrix is condensed per element:
//   K_c = K_uu - K_ua K_aa^-1 K_au,  f_c = f_u - K_ua K_aa^-1 f_a,
//   alpha = K_aa^-1 (f_a - K_au u).
// Strain order: [exx, eyy, ezz, gxy, gyz, gzx] (engineering shear strains).

const HEX_XI = [-1, 1, 1, -1, -1, 1, 1, -1];
const HEX_ETA = [-1, -1, 1, 1, -1, -1, 1, 1];
const HEX_ZETA = [-1, -1, -1, -1, 1, 1, 1, 1];
const GP2 = 1 / Math.sqrt(3);
const NFUN = 11; // 8 nodal shape functions + 3 incompatible modes

/** Derivatives of the 11 functions of an axis-aligned box element at (xi, eta, zeta). */
function boxDerivs(hx, hy, hz, xi, eta, zeta, dx, dy, dz) {
  const sx = 2 / hx, sy = 2 / hy, sz = 2 / hz;
  for (let a = 0; a < 8; a++) {
    const xa = HEX_XI[a], ya = HEX_ETA[a], za = HEX_ZETA[a];
    dx[a] = xa * (1 + ya * eta) * (1 + za * zeta) * 0.125 * sx;
    dy[a] = ya * (1 + xa * xi) * (1 + za * zeta) * 0.125 * sy;
    dz[a] = za * (1 + xa * xi) * (1 + ya * eta) * 0.125 * sz;
  }
  dx[8] = -2 * xi * sx; dy[8] = 0; dz[8] = 0;
  dx[9] = 0; dy[9] = -2 * eta * sy; dz[9] = 0;
  dx[10] = 0; dy[10] = 0; dz[10] = -2 * zeta * sz;
}

/** Trilinear shape functions at (xi, eta, zeta). */
function hexN(xi, eta, zeta, N) {
  for (let a = 0; a < 8; a++) N[a] = 0.125 * (1 + HEX_XI[a] * xi) * (1 + HEX_ETA[a] * eta) * (1 + HEX_ZETA[a] * zeta);
  return N;
}

/**
 * Accumulate w * B^T D B into K (33 x 33 row-major) and w * B^T s0 into f,
 * for one integration point with function derivatives dx, dy, dz.
 */
function accumulatePoint(dx, dy, dz, D, s0, w, K, f) {
  const DB = accumulatePoint._DB;
  for (let b = 0; b < NFUN; b++) {
    const bx = dx[b], by = dy[b], bz = dz[b];
    const o = b * 18;
    for (let r = 0; r < 6; r++) {
      const d = r * 6;
      DB[o + r * 3] = D[d] * bx + D[d + 3] * by + D[d + 5] * bz;
      DB[o + r * 3 + 1] = D[d + 1] * by + D[d + 3] * bx + D[d + 4] * bz;
      DB[o + r * 3 + 2] = D[d + 2] * bz + D[d + 4] * by + D[d + 5] * bx;
    }
  }
  for (let a = 0; a < NFUN; a++) {
    const ax = dx[a] * w, ay = dy[a] * w, az = dz[a] * w;
    if (ax === 0 && ay === 0 && az === 0) continue;
    const ra = 3 * a;
    for (let b = a; b < NFUN; b++) {
      const o = b * 18;
      for (let c = 0; c < 3; c++) {
        const k0 = ax * DB[o + c] + ay * DB[o + 9 + c] + az * DB[o + 15 + c];
        const k1 = ay * DB[o + 3 + c] + ax * DB[o + 9 + c] + az * DB[o + 12 + c];
        const k2 = az * DB[o + 6 + c] + ay * DB[o + 12 + c] + ax * DB[o + 15 + c];
        K[ra * 33 + 3 * b + c] += k0;
        K[(ra + 1) * 33 + 3 * b + c] += k1;
        K[(ra + 2) * 33 + 3 * b + c] += k2;
      }
    }
    if (s0) {
      f[ra] += ax * s0[0] + ay * s0[3] + az * s0[5];
      f[ra + 1] += ay * s0[1] + ax * s0[3] + az * s0[4];
      f[ra + 2] += az * s0[2] + ay * s0[4] + ax * s0[5];
    }
  }
}
accumulatePoint._DB = new Float64Array(NFUN * 18);

/** Mirror the upper block triangle (computed for b >= a) into the lower part. */
function symmetrize33(K) {
  for (let a = 0; a < NFUN; a++) for (let b = a + 1; b < NFUN; b++)
    for (let p = 0; p < 3; p++) for (let q = 0; q < 3; q++) K[(3 * b + q) * 33 + 3 * a + p] = K[(3 * a + p) * 33 + 3 * b + q];
}

/**
 * Static condensation of the 9 incompatible DOFs. Returns
 * {Kc (24x24), fc (24), X = K_aa^-1 K_au (9x24), xf = K_aa^-1 f_a (9)}.
 */
function condense33(K, f, out) {
  out = out || { Kc: new Float64Array(576), fc: new Float64Array(24), X: new Float64Array(216), xf: new Float64Array(9) };
  const Kaa = condense33._Kaa;
  for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) Kaa[i * 9 + j] = K[(24 + i) * 33 + 24 + j];
  cholDense(Kaa, 9, 1e-14);
  const X = out.X, col = condense33._col;
  for (let j = 0; j < 24; j++) {
    for (let i = 0; i < 9; i++) col[i] = K[(24 + i) * 33 + j];
    cholSolveDense(Kaa, 9, col, 0);
    for (let i = 0; i < 9; i++) X[i * 24 + j] = col[i];
  }
  const Kc = out.Kc;
  for (let i = 0; i < 24; i++) {
    for (let j = 0; j < 24; j++) {
      let s = K[i * 33 + j];
      for (let q = 0; q < 9; q++) s -= K[i * 33 + 24 + q] * X[q * 24 + j];
      Kc[i * 24 + j] = s;
    }
  }
  // exact symmetry
  for (let i = 0; i < 24; i++) for (let j = i + 1; j < 24; j++) { const v = 0.5 * (Kc[i * 24 + j] + Kc[j * 24 + i]); Kc[i * 24 + j] = Kc[j * 24 + i] = v; }
  if (f) {
    for (let i = 0; i < 9; i++) col[i] = f[24 + i];
    cholSolveDense(Kaa, 9, col, 0);
    for (let i = 0; i < 9; i++) out.xf[i] = col[i];
    for (let i = 0; i < 24; i++) {
      let s = f[i];
      for (let q = 0; q < 9; q++) s -= K[i * 33 + 24 + q] * out.xf[q];
      out.fc[i] = s;
    }
  }
  return out;
}
condense33._Kaa = new Float64Array(81);
condense33._col = new Float64Array(9);

const _ek = { K: new Float64Array(1089), f: new Float64Array(33), dx: new Float64Array(NFUN), dy: new Float64Array(NFUN), dz: new Float64Array(NFUN) };

/**
 * Homogeneous box element: 2x2x2 Gauss, stiffness D (36) and thermal-stress
 * vector s0 = D eps0 (6, or null). Returns the condensed record.
 */
function boxElement(hx, hy, hz, D, s0) {
  const { K, f, dx, dy, dz } = _ek;
  K.fill(0); f.fill(0);
  const w = hx * hy * hz / 8;
  for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) for (let c = 0; c < 2; c++) {
    boxDerivs(hx, hy, hz, a ? GP2 : -GP2, b ? GP2 : -GP2, c ? GP2 : -GP2, dx, dy, dz);
    accumulatePoint(dx, dy, dz, D, s0, w, K, f);
  }
  symmetrize33(K);
  return condense33(K, s0 ? f : null);
}

/**
 * Layered box element: 2x2 in-plane Gauss x 3 zeta points {-1, 0, 1} with the
 * through-thickness weight matrices W_j (3 x 36) and thermal-stress weights
 * V_j (3 x 6) of buildBandSection; exact for the layered integrand and
 * identical to 2x2 in-plane by 2 through-thickness Gauss points per sub-layer.
 */
function layeredBoxElement(hx, hy, hz, W, V) {
  const { K, f, dx, dy, dz } = _ek;
  K.fill(0); f.fill(0);
  const w = hx * hy * hz / 8;
  const zj = [-1, 0, 1];
  for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) for (let j = 0; j < 3; j++) {
    boxDerivs(hx, hy, hz, a ? GP2 : -GP2, b ? GP2 : -GP2, zj[j], dx, dy, dz);
    accumulatePoint(dx, dy, dz, W.subarray(36 * j, 36 * j + 36), V ? V.subarray(6 * j, 6 * j + 6) : null, w, K, f);
  }
  symmetrize33(K);
  return condense33(K, V ? f : null);
}

/** Strain at (xi, eta, zeta) of a box element from u (24) and alpha (9). */
function boxStrainAt(hx, hy, hz, u, alpha, xi, eta, zeta, eps) {
  const { dx, dy, dz } = _ek;
  boxDerivs(hx, hy, hz, xi, eta, zeta, dx, dy, dz);
  eps = eps || new Float64Array(6);
  eps.fill(0);
  for (let b = 0; b < NFUN; b++) {
    const ux = b < 8 ? u[3 * b] : alpha[3 * (b - 8)];
    const uy = b < 8 ? u[3 * b + 1] : alpha[3 * (b - 8) + 1];
    const uz = b < 8 ? u[3 * b + 2] : alpha[3 * (b - 8) + 2];
    eps[0] += dx[b] * ux; eps[1] += dy[b] * uy; eps[2] += dz[b] * uz;
    eps[3] += dy[b] * ux + dx[b] * uy;
    eps[4] += dz[b] * uy + dy[b] * uz;
    eps[5] += dz[b] * ux + dx[b] * uz;
  }
  return eps;
}

/** alpha = xf * dF - X du (recovery after condensation, thermal factor dF). */
function recoverAlpha(rec, du, dF, alpha) {
  alpha = alpha || new Float64Array(9);
  for (let i = 0; i < 9; i++) {
    let s = rec.xf ? rec.xf[i] * dF : 0;
    for (let j = 0; j < 24; j++) s -= rec.X[i * 24 + j] * du[j];
    alpha[i] = s;
  }
  return alpha;
}

function matVec6(D, e, out) {
  out = out || new Float64Array(6);
  for (let r = 0; r < 6; r++) { let s = 0; for (let c = 0; c < 6; c++) s += D[r * 6 + c] * e[c]; out[r] = s; }
  return out;
}

// ---- general (distorted) hexahedron, used for the patch test -------------------

function inv3(J, out) {
  const a = J[0], b = J[1], c = J[2], d = J[3], e = J[4], f = J[5], g = J[6], h = J[7], i = J[8];
  const det = a * (e * i - f * h) - b * (d * i - f * g) + c * (d * h - e * g);
  out[0] = (e * i - f * h) / det; out[1] = (c * h - b * i) / det; out[2] = (b * f - c * e) / det;
  out[3] = (f * g - d * i) / det; out[4] = (a * i - c * g) / det; out[5] = (c * d - a * f) / det;
  out[6] = (d * h - e * g) / det; out[7] = (b * g - a * h) / det; out[8] = (a * e - b * d) / det;
  return det;
}

/** Function derivatives of a general hex at (xi, eta, zeta); returns det J. */
function generalDerivs(X, xi, eta, zeta, J0inv, detJ0, dx, dy, dz) {
  const dNxi = new Float64Array(8), dNeta = new Float64Array(8), dNzeta = new Float64Array(8);
  for (let a = 0; a < 8; a++) {
    const xa = HEX_XI[a], ya = HEX_ETA[a], za = HEX_ZETA[a];
    dNxi[a] = xa * (1 + ya * eta) * (1 + za * zeta) * 0.125;
    dNeta[a] = ya * (1 + xa * xi) * (1 + za * zeta) * 0.125;
    dNzeta[a] = za * (1 + xa * xi) * (1 + ya * eta) * 0.125;
  }
  const J = new Float64Array(9), Ji = new Float64Array(9);
  for (let a = 0; a < 8; a++) for (let j = 0; j < 3; j++) {
    J[j] += dNxi[a] * X[3 * a + j]; J[3 + j] += dNeta[a] * X[3 * a + j]; J[6 + j] += dNzeta[a] * X[3 * a + j];
  }
  const detJ = inv3(J, Ji);
  for (let a = 0; a < 8; a++) {
    dx[a] = Ji[0] * dNxi[a] + Ji[1] * dNeta[a] + Ji[2] * dNzeta[a];
    dy[a] = Ji[3] * dNxi[a] + Ji[4] * dNeta[a] + Ji[5] * dNzeta[a];
    dz[a] = Ji[6] * dNxi[a] + Ji[7] * dNeta[a] + Ji[8] * dNzeta[a];
  }
  const r = detJ0 / detJ;
  const gp = [[-2 * xi, 0, 0], [0, -2 * eta, 0], [0, 0, -2 * zeta]];
  for (let m = 0; m < 3; m++) {
    const g = gp[m];
    dx[8 + m] = r * (J0inv[0] * g[0] + J0inv[1] * g[1] + J0inv[2] * g[2]);
    dy[8 + m] = r * (J0inv[3] * g[0] + J0inv[4] * g[1] + J0inv[5] * g[2]);
    dz[8 + m] = r * (J0inv[6] * g[0] + J0inv[7] * g[1] + J0inv[8] * g[2]);
  }
  return detJ;
}

function centreJacobian(X) {
  const J = new Float64Array(9), Ji = new Float64Array(9);
  for (let a = 0; a < 8; a++) for (let j = 0; j < 3; j++) {
    J[j] += HEX_XI[a] * 0.125 * X[3 * a + j]; J[3 + j] += HEX_ETA[a] * 0.125 * X[3 * a + j]; J[6 + j] += HEX_ZETA[a] * 0.125 * X[3 * a + j];
  }
  const det = inv3(J, Ji);
  return { Ji, det };
}

/** General hex (node coordinates X, 24) with 2x2x2 Gauss. */
function generalElement(X, D, s0) {
  const { K, f, dx, dy, dz } = _ek;
  K.fill(0); f.fill(0);
  const c0 = centreJacobian(X);
  for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) for (let c = 0; c < 2; c++) {
    const detJ = generalDerivs(X, a ? GP2 : -GP2, b ? GP2 : -GP2, c ? GP2 : -GP2, c0.Ji, c0.det, dx, dy, dz);
    accumulatePoint(dx, dy, dz, D, s0, detJ, K, f);
  }
  symmetrize33(K);
  return condense33(K, s0 ? f : null);
}

/** Strain at a point of a general hex. */
function generalStrainAt(X, u, alpha, xi, eta, zeta) {
  const dx = new Float64Array(NFUN), dy = new Float64Array(NFUN), dz = new Float64Array(NFUN);
  const c0 = centreJacobian(X);
  generalDerivs(X, xi, eta, zeta, c0.Ji, c0.det, dx, dy, dz);
  const eps = new Float64Array(6);
  for (let b = 0; b < NFUN; b++) {
    const ux = b < 8 ? u[3 * b] : alpha[3 * (b - 8)];
    const uy = b < 8 ? u[3 * b + 1] : alpha[3 * (b - 8) + 1];
    const uz = b < 8 ? u[3 * b + 2] : alpha[3 * (b - 8) + 2];
    eps[0] += dx[b] * ux; eps[1] += dy[b] * uy; eps[2] += dz[b] * uz;
    eps[3] += dy[b] * ux + dx[b] * uy; eps[4] += dz[b] * uy + dy[b] * uz; eps[5] += dz[b] * ux + dx[b] * uz;
  }
  return eps;
}

/**
 * Extrapolation from the 8 Gauss points (ordered like the nodes, at +-1/sqrt3)
 * to the 8 nodes: nodal value = sum_g N_g(sqrt3 * node natural coords) v_g.
 */
const GP_TO_NODE = (() => {
  const M = new Float64Array(64), N = new Float64Array(8), s = Math.sqrt(3);
  for (let n = 0; n < 8; n++) {
    hexN(HEX_XI[n] * s, HEX_ETA[n] * s, HEX_ZETA[n] * s, N);
    for (let gq = 0; gq < 8; gq++) M[n * 8 + gq] = N[gq];
  }
  return M;
})();

// ===== Symmetric 3x3 block CSR, upper triangle (Section 7.2) =============
//
// Row i holds blocks (i, j) with j >= i, ascending j; the diagonal block is
// stored in full. Values are 9 doubles per block, row-major.

/** Sparsity pattern from element connectivity (nodes per element = npe). */
function bcsrFromElements(nn, conn, ne, npe) {
  npe = npe || 8;
  // node -> elements adjacency
  const cnt = new Int32Array(nn + 1);
  for (let q = 0; q < ne * npe; q++) cnt[conn[q] + 1]++;
  for (let i = 0; i < nn; i++) cnt[i + 1] += cnt[i];
  const adj = new Int32Array(ne * npe), fill = cnt.slice(0, nn);
  for (let e = 0; e < ne; e++) for (let a = 0; a < npe; a++) { const n = conn[e * npe + a]; adj[fill[n]++] = e; }
  const mark = new Int32Array(nn).fill(-1);
  const rowPtr = new Int32Array(nn + 1);
  const tmp = [];
  // first pass: count
  for (let i = 0; i < nn; i++) {
    let c = 0;
    for (let q = cnt[i]; q < cnt[i + 1]; q++) {
      const e = adj[q];
      for (let a = 0; a < npe; a++) { const j = conn[e * npe + a]; if (j >= i && mark[j] !== i) { mark[j] = i; c++; } }
    }
    rowPtr[i + 1] = rowPtr[i] + c;
  }
  const col = new Int32Array(rowPtr[nn]);
  mark.fill(-1);
  for (let i = 0; i < nn; i++) {
    tmp.length = 0;
    for (let q = cnt[i]; q < cnt[i + 1]; q++) {
      const e = adj[q];
      for (let a = 0; a < npe; a++) { const j = conn[e * npe + a]; if (j >= i && mark[j] !== i) { mark[j] = i; tmp.push(j); } }
    }
    tmp.sort((a, b) => a - b);
    col.set(tmp, rowPtr[i]);
  }
  return { n: nn, rowPtr, col, nb: rowPtr[nn] };
}

/** Block index of (i, j), j >= i; -1 if absent. */
function bcsrFind(P, i, j) {
  const c = P.col;
  let lo = P.rowPtr[i], hi = P.rowPtr[i + 1] - 1;
  while (lo <= hi) {
    const m = (lo + hi) >> 1, v = c[m];
    if (v === j) return m;
    if (v < j) lo = m + 1; else hi = m - 1;
  }
  return -1;
}

/**
 * Element-to-block map: for each element and each ordered local pair (a, b)
 * with node(a) <= node(b), the block index (npe*npe entries, -1 otherwise).
 */
function elementBlockMap(P, conn, ne, npe) {
  npe = npe || 8;
  const map = new Int32Array(ne * npe * npe).fill(-1);
  for (let e = 0; e < ne; e++) {
    for (let a = 0; a < npe; a++) {
      const na = conn[e * npe + a];
      for (let b = 0; b < npe; b++) {
        const nb = conn[e * npe + b];
        if (na <= nb) map[(e * npe + a) * npe + b] = bcsrFind(P, na, nb);
      }
    }
  }
  return map;
}

/** Scatter c * Ke (3npe x 3npe) of element e into block values val. */
function scatterElement(val, Ke, c, conn, e, bmap, npe) {
  npe = npe || 8;
  const n3 = 3 * npe;
  for (let a = 0; a < npe; a++) {
    const na = conn[e * npe + a];
    for (let b = 0; b < npe; b++) {
      const k = bmap[(e * npe + a) * npe + b];
      if (k < 0) continue;
      // node(a) <= node(b): block (na, nb) receives Ke[a, b]
      const v = 9 * k;
      for (let p = 0; p < 3; p++) for (let q = 0; q < 3; q++) val[v + p * 3 + q] += c * Ke[(3 * a + p) * n3 + 3 * b + q];
    }
  }
}

/** y = K x for the symmetric upper-stored block matrix. */
function bcsrMatVec(P, val, x, y) {
  const n = P.n, rp = P.rowPtr, col = P.col;
  y.fill(0);
  for (let i = 0; i < n; i++) {
    const xi0 = x[3 * i], xi1 = x[3 * i + 1], xi2 = x[3 * i + 2];
    let y0 = 0, y1 = 0, y2 = 0;
    for (let k = rp[i]; k < rp[i + 1]; k++) {
      const j = col[k], v = 9 * k;
      const a0 = val[v], a1 = val[v + 1], a2 = val[v + 2], a3 = val[v + 3], a4 = val[v + 4], a5 = val[v + 5], a6 = val[v + 6], a7 = val[v + 7], a8 = val[v + 8];
      const xj0 = x[3 * j], xj1 = x[3 * j + 1], xj2 = x[3 * j + 2];
      y0 += a0 * xj0 + a1 * xj1 + a2 * xj2;
      y1 += a3 * xj0 + a4 * xj1 + a5 * xj2;
      y2 += a6 * xj0 + a7 * xj1 + a8 * xj2;
      if (j !== i) {
        y[3 * j] += a0 * xi0 + a3 * xi1 + a6 * xi2;
        y[3 * j + 1] += a1 * xi0 + a4 * xi1 + a7 * xi2;
        y[3 * j + 2] += a2 * xi0 + a5 * xi1 + a8 * xi2;
      }
    }
    y[3 * i] += y0; y[3 * i + 1] += y1; y[3 * i + 2] += y2;
  }
  return y;
}

/** Diagonal of the scalar matrix. */
function bcsrDiag(P, val, d) {
  d = d || new Float64Array(3 * P.n);
  for (let i = 0; i < P.n; i++) {
    const v = 9 * P.rowPtr[i]; // diagonal block is first in row (j = i is smallest)
    d[3 * i] = val[v]; d[3 * i + 1] = val[v + 4]; d[3 * i + 2] = val[v + 8];
  }
  return d;
}

/**
 * Apply homogeneous Dirichlet constraints (zero rows and columns, keep the
 * diagonal). Returns the saved full rows of the constrained DOFs (for reactions).
 */
function bcsrConstrain(P, val, dofs) {
  const isC = new Uint8Array(3 * P.n);
  for (const d of dofs) isC[d] = 1;
  for (let i = 0; i < P.n; i++) {
    for (let k = P.rowPtr[i]; k < P.rowPtr[i + 1]; k++) {
      const j = P.col[k], v = 9 * k;
      for (let p = 0; p < 3; p++) for (let q = 0; q < 3; q++) {
        const r = 3 * i + p, c = 3 * j + q;
        if ((isC[r] || isC[c]) && !(r === c)) val[v + p * 3 + q] = 0;
      }
    }
  }
  return isC;
}

/** Extract full scalar rows of given DOFs (before constraining) as sparse lists. */
function bcsrRows(P, val, dofs) {
  const want = new Map();
  dofs.forEach((d, q) => want.set(d, q));
  const rows = dofs.map(() => ({ idx: [], val: [] }));
  for (let i = 0; i < P.n; i++) {
    for (let k = P.rowPtr[i]; k < P.rowPtr[i + 1]; k++) {
      const j = P.col[k], v = 9 * k;
      for (let p = 0; p < 3; p++) for (let q = 0; q < 3; q++) {
        const r = 3 * i + p, c = 3 * j + q, a = val[v + p * 3 + q];
        if (want.has(r)) { rows[want.get(r)].idx.push(c); rows[want.get(r)].val.push(a); }
        if (i !== j && want.has(c)) { rows[want.get(c)].idx.push(r); rows[want.get(c)].val.push(a); }
      }
    }
  }
  return rows;
}

function dot(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }
function norm2(a) { return Math.sqrt(dot(a, a)); }
function axpy(alpha, x, y) { for (let i = 0; i < y.length; i++) y[i] += alpha * x[i]; }

// ===== Model assembly: element birth, thermal loads, full block CSR =====
//
// Box elements use closed-form integration: in natural coordinates the
// products d_r N_a d_s N_b are integrated once (2x2 Gauss in-plane, exact
// quadratic Lagrange / Simpson through the thickness, which for a trilinear
// element reproduces 2x2x2 Gauss exactly) and scaled per element by
// (hx hy hz / 8) (2 / h_r) (2 / h_s). K[(a,p),(b,q)] = sum_rs d_r N_a d_s N_b
// D[v(p,r)][v(q,s)] with v the Voigt index of the (p, r) pair.
//
// Total formulation with element birth (Section 6.5):
//   sigma = D(T) (eps - eps_b - [F(T) - F(Tb)]),  eps_b = B q_b
// where q_b (33 DOFs: nodal + incompatible) is the element state when its
// material was born, so the birth load is K33(T) q_b and the thermal load is
// the integral of B^T D [F(T) - F(Tb)].

const VOIGT_IDX = [[0, 3, 5], [3, 1, 4], [5, 4, 2]];

/** Universal natural-coordinate integrals for the 11 functions at 3 zeta stations. */
const UNIV = (() => {
  const G = new Float64Array(3 * 9 * 121);   // [j][rs][a*11+b]
  const g = new Float64Array(3 * 3 * 11);    // [j][r][a]
  const GH = new Float64Array(9 * 121);      // full-box integral
  const gH = new Float64Array(3 * 11);
  const simpson = [1 / 3, 4 / 3, 1 / 3];
  const d = [new Float64Array(11), new Float64Array(11), new Float64Array(11)];
  for (let j = 0; j < 3; j++) {
    const zeta = j - 1;
    for (let ip = 0; ip < 4; ip++) {
      const xi = (ip & 1) ? GP2 : -GP2, eta = (ip & 2) ? GP2 : -GP2;
      for (let a = 0; a < 8; a++) {
        const xa = HEX_XI[a], ya = HEX_ETA[a], za = HEX_ZETA[a];
        d[0][a] = xa * (1 + ya * eta) * (1 + za * zeta) * 0.125;
        d[1][a] = ya * (1 + xa * xi) * (1 + za * zeta) * 0.125;
        d[2][a] = za * (1 + xa * xi) * (1 + ya * eta) * 0.125;
      }
      d[0][8] = -2 * xi; d[1][8] = 0; d[2][8] = 0;
      d[0][9] = 0; d[1][9] = -2 * eta; d[2][9] = 0;
      d[0][10] = 0; d[1][10] = 0; d[2][10] = -2 * zeta;
      for (let r = 0; r < 3; r++) {
        for (let a = 0; a < 11; a++) {
          g[(j * 3 + r) * 11 + a] += d[r][a];
          gH[r * 11 + a] += simpson[j] * d[r][a];
          for (let s = 0; s < 3; s++) for (let b = 0; b < 11; b++) {
            const v = d[r][a] * d[s][b];
            G[((j * 9 + r * 3 + s) * 121) + a * 11 + b] += v;
            GH[(r * 3 + s) * 121 + a * 11 + b] += simpson[j] * v;
          }
        }
      }
    }
  }
  return { G, g, GH, gH };
})();

/**
 * 33x33 stiffness of a box element from stiffness weights at the three zeta
 * stations (Wst, 3 x 36, already including the zeta integration weights) or
 * from a single D (homogeneous, uses the full-box integrals).
 */
function elementK33(hx, hy, hz, Wst, D, K) {
  K.fill(0);
  const h = [hx, hy, hz];
  const V8 = hx * hy * hz / 8;
  const nst = D ? 1 : 3;
  for (let j = 0; j < nst; j++) {
    const Wj = D ? D : Wst.subarray(36 * j, 36 * j + 36);
    for (let r = 0; r < 3; r++) for (let s = 0; s < 3; s++) {
      const c = V8 * (2 / h[r]) * (2 / h[s]);
      const Gb = D ? UNIV.GH.subarray((r * 3 + s) * 121, (r * 3 + s) * 121 + 121) : UNIV.G.subarray((j * 9 + r * 3 + s) * 121, (j * 9 + r * 3 + s) * 121 + 121);
      for (let p = 0; p < 3; p++) for (let q = 0; q < 3; q++) {
        const dv = c * Wj[VOIGT_IDX[p][r] * 6 + VOIGT_IDX[q][s]];
        if (dv === 0) continue;
        for (let a = 0; a < NFUN; a++) {
          const ga = Gb.subarray(a * 11, a * 11 + 11);
          const row = (3 * a + p) * 33 + q;
          for (let b = 0; b < NFUN; b++) K[row + 3 * b] += dv * ga[b];
        }
      }
    }
  }
  return K;
}

/**
 * Box-element shape matrices M^{rs} (33 x 33) such that
 *   K33 = sum_{r,s} c_rs M^{rs},  c_rs = (hx hy hz / 8)(2 / h_r)(2 / h_s),
 * built once per material and temperature. Since c_rs = c_sr the six
 * symmetric combinations (rr) and (rs + sr, r < s) are stored: index
 * 0:xx 1:yy 2:zz 3:xy 4:yz 5:zx.
 */
function shapeMatrices(Wst, D, M) {
  M = M || new Float64Array(6 * 1089);
  M.fill(0);
  const nst = D ? 1 : 3;
  const PAIR = [[0, 0, 0], [1, 1, 1], [2, 2, 2], [3, 0, 1], [4, 1, 2], [5, 2, 0]];
  for (let j = 0; j < nst; j++) {
    const Wj = D ? D : Wst.subarray(36 * j, 36 * j + 36);
    for (const [m, r, s] of PAIR) {
      const Mm = M.subarray(m * 1089, m * 1089 + 1089);
      const rsList = r === s ? [[r, s]] : [[r, s], [s, r]];
      for (const [rr, ss] of rsList) {
        const Gb = D ? UNIV.GH.subarray((rr * 3 + ss) * 121, (rr * 3 + ss) * 121 + 121) : UNIV.G.subarray((j * 9 + rr * 3 + ss) * 121, (j * 9 + rr * 3 + ss) * 121 + 121);
        for (let p = 0; p < 3; p++) for (let q = 0; q < 3; q++) {
          const dv = Wj[VOIGT_IDX[p][rr] * 6 + VOIGT_IDX[q][ss]];
          if (dv === 0) continue;
          for (let a = 0; a < NFUN; a++) {
            const row = (3 * a + p) * 33 + q, ga = a * 11;
            for (let b = 0; b < NFUN; b++) Mm[row + 3 * b] += dv * Gb[ga + b];
          }
        }
      }
    }
  }
  return M;
}

/** K33 (full, symmetric) from shape matrices and box dimensions. */
function elementK33Fast(hx, hy, hz, M, K) {
  const V8 = hx * hy * hz / 8;
  const c = [V8 * 4 / (hx * hx), V8 * 4 / (hy * hy), V8 * 4 / (hz * hz), V8 * 4 / (hx * hy), V8 * 4 / (hy * hz), V8 * 4 / (hz * hx)];
  for (let i = 0; i < 33; i++) {
    const ri = i * 33;
    for (let j = i; j < 33; j++) {
      const o = ri + j;
      K[o] = c[0] * M[o] + c[1] * M[1089 + o] + c[2] * M[2178 + o] + c[3] * M[3267 + o] + c[4] * M[4356 + o] + c[5] * M[5445 + o];
    }
  }
  for (let i = 0; i < 33; i++) for (let j = i + 1; j < 33; j++) K[j * 33 + i] = K[i * 33 + j];
  return K;
}

/**
 * Thermal load (33) of a box element: integral of B^T s with s the thermal
 * stress weights per zeta station (Sst, 3 x 6, including zeta weights) or a
 * single stress s0 (6) for a homogeneous element.
 */
function elementFth(hx, hy, hz, Sst, s0, f) {
  f.fill(0);
  const h = [hx, hy, hz];
  const V8 = hx * hy * hz / 8;
  const nst = s0 ? 1 : 3;
  for (let j = 0; j < nst; j++) {
    const Sj = s0 ? s0 : Sst.subarray(6 * j, 6 * j + 6);
    for (let r = 0; r < 3; r++) {
      const c = V8 * (2 / h[r]);
      const gb = s0 ? UNIV.gH.subarray(r * 11, r * 11 + 11) : UNIV.g.subarray((j * 3 + r) * 11, (j * 3 + r) * 11 + 11);
      for (let p = 0; p < 3; p++) {
        const sv = c * Sj[VOIGT_IDX[p][r]];
        if (sv === 0) continue;
        for (let a = 0; a < NFUN; a++) f[3 * a + p] += sv * gb[a];
      }
    }
  }
  return f;
}

/** y = K33 x (33). */
function mul33(K, x, y) {
  for (let i = 0; i < 33; i++) { let s = 0; const r = i * 33; for (let j = 0; j < 33; j++) s += K[r + j] * x[j]; y[i] = s; }
  return y;
}

/** Full (both triangles) block CSR pattern from the upper one. */
function fullPatternFromUpper(P) {
  const n = P.n;
  const cnt = new Int32Array(n + 1);
  for (let i = 0; i < n; i++) for (let k = P.rowPtr[i]; k < P.rowPtr[i + 1]; k++) { const j = P.col[k]; cnt[i + 1]++; if (j !== i) cnt[j + 1]++; }
  for (let i = 0; i < n; i++) cnt[i + 1] += cnt[i];
  const col = new Int32Array(cnt[n]), fill = cnt.slice(0, n);
  for (let i = 0; i < n; i++) for (let k = P.rowPtr[i]; k < P.rowPtr[i + 1]; k++) { const j = P.col[k]; col[fill[i]++] = j; if (j !== i) col[fill[j]++] = i; }
  // sort each row
  for (let i = 0; i < n; i++) { const s = col.subarray(cnt[i], cnt[i + 1]); s.sort(); }
  const diag = new Int32Array(n);
  for (let i = 0; i < n; i++) for (let k = cnt[i]; k < cnt[i + 1]; k++) if (col[k] === i) { diag[i] = k; break; }
  return { n, rowPtr: cnt, col, nb: cnt[n], diag };
}

/** y = K x for a full block CSR. */
function fullMatVec(P, val, x, y) {
  const n = P.n, rp = P.rowPtr, col = P.col;
  for (let i = 0; i < n; i++) {
    let y0 = 0, y1 = 0, y2 = 0;
    for (let k = rp[i]; k < rp[i + 1]; k++) {
      const j = col[k], v = 9 * k;
      const xj0 = x[3 * j], xj1 = x[3 * j + 1], xj2 = x[3 * j + 2];
      y0 += val[v] * xj0 + val[v + 1] * xj1 + val[v + 2] * xj2;
      y1 += val[v + 3] * xj0 + val[v + 4] * xj1 + val[v + 5] * xj2;
      y2 += val[v + 6] * xj0 + val[v + 7] * xj1 + val[v + 8] * xj2;
    }
    y[3 * i] = y0; y[3 * i + 1] = y1; y[3 * i + 2] = y2;
  }
  return y;
}

/**
 * Finite-element model of a mesh: group property tables, element birth
 * states, sparsity, assembly and strain / stress recovery.
 */
class FEModel {
  constructor(mesh, cfg, opts) {
    opts = opts || {};
    this.mesh = mesh;
    this.cfg = cfg;
    this.lib = cfg.materials;
    this.nuMax = opts.nuMax || CONST.NU_MAX_GLOBAL;
    this.birthT = opts.birthT || [cfg.process.Tsub, cfg.process.Tjoin, cfg.process.Tuf, cfg.process.Tattach];
    const t0 = nowMs();
    this.groups = mesh.groups.map(g => this._prepareGroup(g));
    this.sections = mesh.geom ? mesh.geom.sub.bands.map(b => buildBandSection(b, this.lib, this.nuMax)) : (opts.sections || []);
    this.qb = new Float64Array(mesh.ne * 33);
    this.upper = bcsrFromElements(mesh.nn, mesh.conn, mesh.ne, 8);
    this.pattern = fullPatternFromUpper(this.upper);
    this.bmap = this._blockMap();
    this.val = new Float64Array(this.pattern.nb * 9);
    this.ndof = 3 * mesh.nn;
    this.constraints = mesh.constraints ? mesh.constraints.dofs : (opts.constraints || new Int32Array(0));
    this.setupMs = nowMs() - t0;
    this._K33 = new Float64Array(1089); this._f33 = new Float64Array(33); this._tmp33 = new Float64Array(33);
    this._W = new Float64Array(108); this._V = new Float64Array(18); this._D = new Float64Array(36); this._s0 = new Float64Array(6);
    this._cond = { Kc: new Float64Array(576), fc: new Float64Array(24), X: new Float64Array(216), xf: new Float64Array(9) };
  }

  /** Per-group stiffness and thermal-strain tables on the 1 degC grid. */
  _prepareGroup(g) {
    const out = Object.assign({}, g);
    if (g.kind === 'layered') return out;
    if (g.kind === 'rowmat') {
      // one homogenized substrate row as a homogeneous orthotropic material (V5)
      out.Dgrid = new Float64Array(TGRID_N * 36);
      out.F = new Float64Array(TGRID_N * 3);
      const tmp = new Float64Array(36);
      const al = [];
      for (let k = 0; k <= 2 * (TGRID_N - 1); k++) { const ec = substrateRowEC(g.row, CONST.TGRID_MIN + 0.5 * k, this.lib); al.push([ec.ax, ec.ay, ec.az]); }
      for (let i = 1; i < TGRID_N; i++) for (let c = 0; c < 3; c++) out.F[3 * i + c] = out.F[3 * (i - 1) + c] + (al[2 * (i - 1)][c] + 4 * al[2 * i - 1][c] + al[2 * i][c]) / 6;
      const i25 = CONST.T_STRAIN_ORIGIN - CONST.TGRID_MIN;
      for (let c = 0; c < 3; c++) { const off = out.F[3 * i25 + c]; for (let i = 0; i < TGRID_N; i++) out.F[3 * i + c] -= off; }
      for (let i = 0; i < TGRID_N; i++) { orthoD(substrateRowEC(g.row, CONST.TGRID_MIN + i, this.lib), this.nuMax, tmp); out.Dgrid.set(tmp, 36 * i); }
      out.tgs = [];
      return out;
    }
    const mat = findMaterial(this.lib, g.mat);
    out.material = mat;
    out.tgs = materialTgs(mat);
    const ctes = materialCte(mat);
    out.F = new Float64Array(TGRID_N * 3);
    for (let i = 0; i < TGRID_N; i++) {
      const T = CONST.TGRID_MIN + i;
      const fxy = thermalStrain(ctes.xy, T), fz = (ctes.z === ctes.xy) ? fxy : thermalStrain(ctes.z, T);
      out.F[3 * i] = fxy; out.F[3 * i + 1] = fxy; out.F[3 * i + 2] = fz;
    }
    if (mat.elastic.type === 'cubic') {
      out.Dconst = siliconD(mat, g.siModel || 'aniso');
      out.solidus = null;
    } else if (mat.elastic.type === 'iso') {
      const t = materialTables(mat);
      const constE = mat.elastic.E.type === 'const' && !mat.solidus;
      if (constE) out.Dconst = isoD(t.E[0], t.nu, this.nuMax);
      else {
        out.Dgrid = new Float64Array(TGRID_N * 36);
        const tmp = new Float64Array(36);
        for (let i = 0; i < TGRID_N; i++) { isoD(t.E[i], t.nu, this.nuMax, tmp); out.Dgrid.set(tmp, 36 * i); }
      }
      out.solidus = mat.solidus ? pv(mat.solidus) : null;
    } else if (mat.elastic.type === 'ortho') {
      out.Dgrid = new Float64Array(TGRID_N * 36);
      const tmp = new Float64Array(36);
      for (let i = 0; i < TGRID_N; i++) { orthoD(materialEC(mat, CONST.TGRID_MIN + i), this.nuMax, tmp); out.Dgrid.set(tmp, 36 * i); }
    }
    return out;
  }

  groupD(g, T, out) {
    if (g.Dconst) { out.set(g.Dconst); return out; }
    let x = clamp(T - CONST.TGRID_MIN, 0, TGRID_N - 1);
    const i = Math.min(Math.floor(x), TGRID_N - 2), t = x - i;
    const a = 36 * i, b = a + 36;
    for (let q = 0; q < 36; q++) out[q] = g.Dgrid[a + q] + t * (g.Dgrid[b + q] - g.Dgrid[a + q]);
    return out;
  }

  /** Thermal strain difference F(T) - F(Tb) (3 normal components) of a homogeneous group. */
  groupDF(g, T, Tb, out) {
    for (let c = 0; c < 3; c++) out[c] = gridAt(g.F, T, 3, c) - gridAt(g.F, Tb, 3, c);
    return out;
  }

  _blockMap() {
    const m = this.mesh, P = this.pattern;
    const map = new Int32Array(m.ne * 64);
    for (let e = 0; e < m.ne; e++) for (let a = 0; a < 8; a++) {
      const na = m.conn[8 * e + a];
      for (let b = 0; b < 8; b++) {
        const nb = m.conn[8 * e + b];
        // binary search in row na
        let lo = P.rowPtr[na], hi = P.rowPtr[na + 1] - 1, k = -1;
        while (lo <= hi) { const mid = (lo + hi) >> 1; const v = P.col[mid]; if (v === nb) { k = mid; break; } if (v < nb) lo = mid + 1; else hi = mid - 1; }
        map[(e * 8 + a) * 8 + b] = k;
      }
    }
    return map;
  }

  elementDims(e) {
    const m = this.mesh, i = m.eIJK[3 * e], j = m.eIJK[3 * e + 1], k = m.eIJK[3 * e + 2];
    return [m.xs[i + 1] - m.xs[i], m.ys[j + 1] - m.ys[j], m.zs[k + 1] - m.zs[k]];
  }

  isBorn(g, stage) { return g.stage <= stage; }

  /** Per-temperature group data: shape matrices and thermal stress weights. */
  prepareT(T, stage) {
    if (this._prepT === T && this._prepStage === stage) return;
    this._prepT = T; this._prepStage = stage;
    for (const g of this.groups) {
      if (g.kind === 'layered') continue;
      g._D = g._D || new Float64Array(36);
      this.groupD(g, T, g._D);
      g._M = shapeMatrices(null, g._D, g._M);
      g._born = this.isBorn(g, stage);
      if (g._born) {
        const dF = this.groupDF(g, T, this.birthT[g.stage], this._s0);
        g._s0 = g._s0 || new Float64Array(6);
        const D = g._D;
        for (let r = 0; r < 6; r++) g._s0[r] = D[r * 6] * dF[0] + D[r * 6 + 1] * dF[1] + D[r * 6 + 2] * dF[2];
      }
    }
    for (const sec of this.sections) {
      sectionW(sec, T, this._W);
      sec._M = shapeMatrices(this._W, null, sec._M);
      sec._V = sectionV(sec, T, this.birthT[0], sec._V);
    }
  }

  /**
   * Element stiffness K33 (and load f33 when born) at temperature T. Returns
   * true when the load is non-zero.
   */
  elementSystem(e, T, stage, K33, f33) {
    this.prepareT(T, stage);
    const m = this.mesh, g = this.groups[m.eGroup[e]];
    const i = m.eIJK[3 * e], j = m.eIJK[3 * e + 1], k = m.eIJK[3 * e + 2];
    const hx = m.xs[i + 1] - m.xs[i], hy = m.ys[j + 1] - m.ys[j], hz = m.zs[k + 1] - m.zs[k];
    const born = g.stage <= stage;
    let hasF = false;
    if (g.kind === 'layered') {
      const sec = this.sections[m.subBand[k]];
      elementK33Fast(hx, hy, hz, sec._M, K33);
      if (born) { elementFth(hx, hy, hz, sec._V, null, f33); hasF = true; }
    } else {
      elementK33Fast(hx, hy, hz, g._M, K33);
      if (born) { elementFth(hx, hy, hz, null, g._s0, f33); hasF = true; }
    }
    if (born && g.stage > 0) {
      const qb = this.qb.subarray(33 * e, 33 * e + 33);
      const t = this._tmp33;
      mul33(K33, qb, t);
      for (let i = 0; i < 33; i++) f33[i] += t[i];
      hasF = true;
    }
    return hasF;
  }

  /**
   * Assemble K(T) (full block CSR values) and the load vector for the given
   * stage. Unborn elements keep UNBORN_SCALE x stiffness and no load.
   */
  assemble(T, stage, rhs, noConstraints) {
    const m = this.mesh, val = this.val, bmap = this.bmap;
    val.fill(0); rhs.fill(0);
    const K33 = this._K33, f33 = this._f33, cond = this._cond;
    for (let e = 0; e < m.ne; e++) {
      const g = this.groups[m.eGroup[e]];
      const born = this.isBorn(g, stage);
      const scale = m.eScale[e] * (born ? 1 : CONST.UNBORN_SCALE);
      f33.fill(0);
      const hasF = this.elementSystem(e, T, stage, K33, f33);
      condense33(K33, hasF ? f33 : null, cond);
      const Kc = cond.Kc;
      for (let a = 0; a < 8; a++) {
        for (let b = 0; b < 8; b++) {
          const k = bmap[(e * 8 + a) * 8 + b];
          const v = 9 * k;
          for (let p = 0; p < 3; p++) {
            const r = (3 * a + p) * 24 + 3 * b;
            val[v + 3 * p] += scale * Kc[r]; val[v + 3 * p + 1] += scale * Kc[r + 1]; val[v + 3 * p + 2] += scale * Kc[r + 2];
          }
        }
        if (hasF) {
          const n = m.conn[8 * e + a];
          rhs[3 * n] += scale * cond.fc[3 * a]; rhs[3 * n + 1] += scale * cond.fc[3 * a + 1]; rhs[3 * n + 2] += scale * cond.fc[3 * a + 2];
        }
      }
    }
    if (!noConstraints) this.applyConstraints(rhs);
  }

  /** Zero rows / columns of the constrained DOFs (diagonal kept), zero rhs. */
  applyConstraints(rhs) {
    const P = this.pattern, val = this.val;
    const isC = new Uint8Array(this.ndof);
    for (const d of this.constraints) isC[d] = 1;
    this.isConstrained = isC;
    for (const d of this.constraints) {
      const i = Math.floor(d / 3), p = d % 3;
      for (let k = P.rowPtr[i]; k < P.rowPtr[i + 1]; k++) {
        const j = P.col[k], v = 9 * k;
        for (let q = 0; q < 3; q++) { if (3 * j + q !== d) val[v + 3 * p + q] = 0; }
        // symmetric counterpart: block (j, i), column p
        let lo = P.rowPtr[j], hi = P.rowPtr[j + 1] - 1, kk = -1;
        while (lo <= hi) { const mid = (lo + hi) >> 1; const c = P.col[mid]; if (c === i) { kk = mid; break; } if (c < i) lo = mid + 1; else hi = mid - 1; }
        const w = 9 * kk;
        for (let q = 0; q < 3; q++) { if (3 * j + q !== d) val[w + 3 * q + p] = 0; }
      }
      if (rhs) rhs[d] = 0;
    }
  }

  /** Element DOF vector (24) from the global solution. */
  elementU(u, e, out) {
    const m = this.mesh;
    for (let a = 0; a < 8; a++) { const n = m.conn[8 * e + a]; out[3 * a] = u[3 * n]; out[3 * a + 1] = u[3 * n + 1]; out[3 * a + 2] = u[3 * n + 2]; }
    return out;
  }

  /**
   * Full element state q (33) at temperature T for solution u: nodal DOFs plus
   * recovered incompatible-mode parameters alpha = K_aa^-1 (f_a - K_au u).
   */
  elementState(e, T, stage, u, q) {
    const K33 = this._K33, f33 = this._f33;
    f33.fill(0);
    this.elementSystem(e, T, stage, K33, f33);
    this.elementU(u, e, q);
    const Kaa = condense33._Kaa, col = condense33._col;
    for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) Kaa[i * 9 + j] = K33[(24 + i) * 33 + 24 + j];
    cholDense(Kaa, 9, 1e-14);
    for (let i = 0; i < 9; i++) {
      let s = f33[24 + i];
      for (let j = 0; j < 24; j++) s -= K33[(24 + i) * 33 + j] * q[j];
      col[i] = s;
    }
    cholSolveDense(Kaa, 9, col, 0);
    for (let i = 0; i < 9; i++) q[24 + i] = col[i];
    return q;
  }

  /** Record the birth state q_b of every element of the given stage from solution u at T. */
  recordBirth(stage, T, u) {
    const m = this.mesh, q = new Float64Array(33);
    for (let e = 0; e < m.ne; e++) {
      const g = this.groups[m.eGroup[e]];
      if (g.stage !== stage) continue;
      this.elementState(e, T, stage - 1, u, q);
      this.qb.set(q, 33 * e);
    }
  }

  /**
   * Stress and strain of element e at natural point (xi, eta, zeta) from a
   * recovered state q at T. Returns {eps (total), sig}. Layered elements use
   * the sub-layer stiffness at that zeta.
   */
  pointStress(e, T, stage, q, xi, eta, zeta, out) {
    out = out || { eps: new Float64Array(6), sig: new Float64Array(6), mech: new Float64Array(6) };
    const m = this.mesh, g = this.groups[m.eGroup[e]];
    const [hx, hy, hz] = this.elementDims(e);
    const qb = this.qb.subarray(33 * e, 33 * e + 33);
    const dq = this._tmp33;
    for (let i = 0; i < 33; i++) dq[i] = q[i] - qb[i];
    boxStrainAt(hx, hy, hz, q, q.subarray(24), xi, eta, zeta, out.eps);
    boxStrainAt(hx, hy, hz, dq, dq.subarray(24), xi, eta, zeta, out.mech);
    const born = this.isBorn(g, stage);
    const Tb = this.birthT[g.stage];
    const D = this._D;
    let dF;
    if (g.kind === 'layered') {
      const sec = this.sections[m.subBand[m.eIJK[3 * e + 2]]];
      const z = m.zs[m.eIJK[3 * e + 2]] + 0.5 * (zeta + 1) * hz;
      let s = sec.ns - 1;
      for (let q2 = 0; q2 < sec.ns; q2++) if (z <= sec.subZ[q2][1] + 1e-12) { s = q2; break; }
      let x = clamp(T - CONST.TGRID_MIN, 0, TGRID_N - 1);
      const i = Math.min(Math.floor(x), TGRID_N - 2), t = x - i;
      const da = (s * TGRID_N + i) * 36, db = da + 36;
      for (let r = 0; r < 36; r++) D[r] = sec.D[da + r] + t * (sec.D[db + r] - sec.D[da + r]);
      const fb = s * TGRID_N * 3;
      const Fs = sec.F.subarray(fb, fb + TGRID_N * 3);
      dF = [gridAt(Fs, T, 3, 0) - gridAt(Fs, Tb, 3, 0), gridAt(Fs, T, 3, 1) - gridAt(Fs, Tb, 3, 1), gridAt(Fs, T, 3, 2) - gridAt(Fs, Tb, 3, 2)];
    } else {
      this.groupD(g, T, D);
      dF = this.groupDF(g, T, Tb, this._s0);
    }
    const em = out.mech;
    if (!born) { out.sig.fill(0); return out; }
    const e0 = em[0] - dF[0], e1 = em[1] - dF[1], e2 = em[2] - dF[2];
    for (let r = 0; r < 6; r++) out.sig[r] = D[r * 6] * e0 + D[r * 6 + 1] * e1 + D[r * 6 + 2] * e2 + D[r * 6 + 3] * em[3] + D[r * 6 + 4] * em[4] + D[r * 6 + 5] * em[5];
    return out;
  }
}

// ===== Linear solvers (Section 7.3) =========================================
//
// PCG on the Jacobi-scaled full block CSR matrix Ks = S K S, S = diag(K)^-1/2.
// Preconditioners: semi-coarsening geometric multigrid (coarsen x and y only,
// keep all z-planes; column block Gauss-Seidel smoother with block-tridiagonal
// Cholesky of each (i, j) column; Galerkin coarse operators; dense Cholesky on
// the coarsest grid) and IC(0) with a Manteuffel diagonal shift as fallback.

// ---- 3x3 block helpers ---------------------------------------------------------------

/** Lower Cholesky of a symmetric 3x3 block A (9) into L (9, lower). Returns false on breakdown. */
function chol3(A, a, L, l, jit) {
  const a00 = A[a] + jit, a10 = A[a + 3], a11 = A[a + 4] + jit, a20 = A[a + 6], a21 = A[a + 7], a22 = A[a + 8] + jit;
  if (!(a00 > 0)) return false;
  const l00 = Math.sqrt(a00);
  const l10 = a10 / l00, l20 = a20 / l00;
  const d11 = a11 - l10 * l10;
  if (!(d11 > 0)) return false;
  const l11 = Math.sqrt(d11);
  const l21 = (a21 - l20 * l10) / l11;
  const d22 = a22 - l20 * l20 - l21 * l21;
  if (!(d22 > 0)) return false;
  L[l] = l00; L[l + 1] = 0; L[l + 2] = 0; L[l + 3] = l10; L[l + 4] = l11; L[l + 5] = 0; L[l + 6] = l20; L[l + 7] = l21; L[l + 8] = Math.sqrt(d22);
  return true;
}

/**
 * Column block-tridiagonal Cholesky factors of one level: per node n the
 * diagonal factor L_nn (lower 3x3) and the sub-diagonal factor L_{n,n-1}.
 */
function factorColumns(level) {
  const P = level.P, val = level.val, nn = P.n;
  const F = new Float64Array(nn * 18);
  const down = level.down; // block index of (n, n-1) within the column or -1
  const tmp = new Float64Array(9), D = new Float64Array(9);
  let jitter = 0;
  for (let n = 0; n < nn; n++) {
    const dv = 9 * P.diag[n];
    for (let q = 0; q < 9; q++) D[q] = val[dv + q];
    const fo = 18 * n;
    if (down[n] >= 0) {
      // L_{n,n-1} = A_{n,n-1} L_{n-1,n-1}^-T  (solve X L^T = A, i.e. L X^T = A^T)
      const av = 9 * down[n], lp = 18 * (n - 1);
      for (let r = 0; r < 3; r++) {
        // row r of X: solve L y = A[r,:]^T
        const b0 = val[av + 3 * r], b1 = val[av + 3 * r + 1], b2 = val[av + 3 * r + 2];
        const y0 = b0 / F[lp];
        const y1 = (b1 - F[lp + 3] * y0) / F[lp + 4];
        const y2 = (b2 - F[lp + 6] * y0 - F[lp + 7] * y1) / F[lp + 8];
        tmp[3 * r] = y0; tmp[3 * r + 1] = y1; tmp[3 * r + 2] = y2;
      }
      for (let q = 0; q < 9; q++) F[fo + 9 + q] = tmp[q];
      // D = A_nn - X X^T
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
        D[3 * r + c] -= tmp[3 * r] * tmp[3 * c] + tmp[3 * r + 1] * tmp[3 * c + 1] + tmp[3 * r + 2] * tmp[3 * c + 2];
      }
    } else {
      for (let q = 0; q < 9; q++) F[fo + 9 + q] = 0;
    }
    let jit = 0;
    for (let t = 0; t < 8 && !chol3(D, 0, F, fo, jit); t++) {
      jit = jit ? jit * 10 : 1e-10 * Math.max(Math.abs(D[0]), Math.abs(D[4]), Math.abs(D[8]), 1e-300);
      jitter++;
    }
  }
  level.colFact = F;
  level.colJitter = jitter;
}

/** x_col = K_cc^-1 r_col for one column (nodes n0 .. n1-1), result into x. */
function solveColumn(level, n0, n1, r, x) {
  const F = level.colFact;
  // forward: y_k = L_kk^-1 (r_k - L_{k,k-1} y_{k-1})
  for (let n = n0; n < n1; n++) {
    const fo = 18 * n;
    let b0 = r[3 * n], b1 = r[3 * n + 1], b2 = r[3 * n + 2];
    if (n > n0) {
      const p0 = x[3 * n - 3], p1 = x[3 * n - 2], p2 = x[3 * n - 1];
      b0 -= F[fo + 9] * p0 + F[fo + 10] * p1 + F[fo + 11] * p2;
      b1 -= F[fo + 12] * p0 + F[fo + 13] * p1 + F[fo + 14] * p2;
      b2 -= F[fo + 15] * p0 + F[fo + 16] * p1 + F[fo + 17] * p2;
    }
    const y0 = b0 / F[fo];
    const y1 = (b1 - F[fo + 3] * y0) / F[fo + 4];
    const y2 = (b2 - F[fo + 6] * y0 - F[fo + 7] * y1) / F[fo + 8];
    x[3 * n] = y0; x[3 * n + 1] = y1; x[3 * n + 2] = y2;
  }
  // backward: x_k = L_kk^-T (y_k - L_{k+1,k}^T x_{k+1})
  for (let n = n1 - 1; n >= n0; n--) {
    const fo = 18 * n;
    let b0 = x[3 * n], b1 = x[3 * n + 1], b2 = x[3 * n + 2];
    if (n + 1 < n1) {
      const fn = 18 * (n + 1);
      const q0 = x[3 * n + 3], q1 = x[3 * n + 4], q2 = x[3 * n + 5];
      b0 -= F[fn + 9] * q0 + F[fn + 12] * q1 + F[fn + 15] * q2;
      b1 -= F[fn + 10] * q0 + F[fn + 13] * q1 + F[fn + 16] * q2;
      b2 -= F[fn + 11] * q0 + F[fn + 14] * q1 + F[fn + 17] * q2;
    }
    const z2 = b2 / F[fo + 8];
    const z1 = (b1 - F[fo + 7] * z2) / F[fo + 4];
    const z0 = (b0 - F[fo + 3] * z1 - F[fo + 6] * z2) / F[fo];
    x[3 * n] = z0; x[3 * n + 1] = z1; x[3 * n + 2] = z2;
  }
}

// ---- multigrid hierarchy ---------------------------------------------------------------
//
// Level 0 is the 3D solid mesh (3 DOFs per node) smoothed by column block
// Gauss-Seidel. Its coarse space is a stack of shells: every (column, segment)
// aggregate of nodes carries 6 DOFs (t_x, t_y, t_z, theta_x, theta_y, eps_z)
// and a node at height z' above the aggregate reference moves as
//   u_x = t_x + theta_y z',  u_y = t_y - theta_x z',  u_z = t_z + eps_z z'.
// Segments split each column at the compliant layers (substrate / die stack /
// lid) so relative motion through the bump layer and the TIM is represented.
// Shell levels are semi-coarsened in x and y with linear interpolation of the
// in-plane DOFs and rotations and cubic Hermite interpolation of the
// deflection t_z from (t_z, theta), which keeps the shear strain of bending
// modes consistent (plain nodal interpolation puts (L/t)^2 times too much
// energy into them and stalls the coarse correction).

/** Per-node block index of (n, n-1) when n-1 is in the same column. */
function columnDownIndex(P, colStart) {
  const down = new Int32Array(P.n).fill(-1);
  for (let c = 0; c + 1 < colStart.length; c++) {
    for (let n = colStart[c] + 1; n < colStart[c + 1]; n++) {
      let lo = P.rowPtr[n], hi = P.rowPtr[n + 1] - 1;
      while (lo <= hi) { const mid = (lo + hi) >> 1; const v = P.col[mid]; if (v === n - 1) { down[n] = mid; break; } if (v < n - 1) lo = mid + 1; else hi = mid - 1; }
    }
  }
  return down;
}

/** y = K x for a block CSR with block size b. */
function blockMatVec(P, val, b, x, y) {
  if (b === 3) return fullMatVec(P, val, x, y);
  const n = P.n, rp = P.rowPtr, col = P.col;
  for (let i = 0; i < n; i++) {
    let y0 = 0, y1 = 0, y2 = 0, y3 = 0, y4 = 0, y5 = 0;
    for (let k = rp[i]; k < rp[i + 1]; k++) {
      const j = col[k], v = 36 * k, o = 6 * j;
      const x0 = x[o], x1 = x[o + 1], x2 = x[o + 2], x3 = x[o + 3], x4 = x[o + 4], x5 = x[o + 5];
      y0 += val[v] * x0 + val[v + 1] * x1 + val[v + 2] * x2 + val[v + 3] * x3 + val[v + 4] * x4 + val[v + 5] * x5;
      y1 += val[v + 6] * x0 + val[v + 7] * x1 + val[v + 8] * x2 + val[v + 9] * x3 + val[v + 10] * x4 + val[v + 11] * x5;
      y2 += val[v + 12] * x0 + val[v + 13] * x1 + val[v + 14] * x2 + val[v + 15] * x3 + val[v + 16] * x4 + val[v + 17] * x5;
      y3 += val[v + 18] * x0 + val[v + 19] * x1 + val[v + 20] * x2 + val[v + 21] * x3 + val[v + 22] * x4 + val[v + 23] * x5;
      y4 += val[v + 24] * x0 + val[v + 25] * x1 + val[v + 26] * x2 + val[v + 27] * x3 + val[v + 28] * x4 + val[v + 29] * x5;
      y5 += val[v + 30] * x0 + val[v + 31] * x1 + val[v + 32] * x2 + val[v + 33] * x3 + val[v + 34] * x4 + val[v + 35] * x5;
    }
    const o = 6 * i;
    y[o] = y0; y[o + 1] = y1; y[o + 2] = y2; y[o + 3] = y3; y[o + 4] = y4; y[o + 5] = y5;
  }
  return y;
}

/** Fine (solid) level from a structured mesh and scaled matrix values. */
function makeFineLevel(mesh, P, val, planeSeg) {
  const level = {
    kind: 'solid', b: 3, nx: mesh.nx, ny: mesh.ny, nz: mesh.nz, xs: mesh.xs, ys: mesh.ys, nodeId: mesh.nodeId, nn: mesh.nn,
    colStart: mesh.colStart, P, val, coords: mesh.coords, planeSeg: planeSeg || new Int32Array(mesh.nz),
  };
  level.down = columnDownIndex(P, level.colStart);
  level._r = new Float64Array(3 * mesh.nn); level._dx = new Float64Array(3 * mesh.nn);
  return level;
}

/**
 * Coarse index set: every other line plus the last one, always keeping the
 * feature lines (die, fillet, lid foot and stiffener edges) so that every
 * coarse level still resolves the stacks that change across those lines.
 */
function coarseLines(n, keep) {
  const set = new Set();
  for (let i = 0; i < n; i += 2) set.add(i);
  set.add(n - 1);
  if (keep) for (const k of keep) if (k >= 0 && k < n) set.add(k);
  return Array.from(set).sort((a, b) => a - b);
}

/** Children (transpose) lists of a prolongation. */
function transposeProl(prol, nnc) {
  const ptr = new Int32Array(nnc + 1);
  for (let q = 0; q < prol.idx.length; q++) ptr[prol.idx[q] + 1]++;
  for (let c = 0; c < nnc; c++) ptr[c + 1] += ptr[c];
  const idx = new Int32Array(prol.idx.length), widx = new Int32Array(prol.idx.length), fill = ptr.slice(0, nnc);
  for (let f = 0; f + 1 < prol.ptr.length; f++) for (let q = prol.ptr[f]; q < prol.ptr[f + 1]; q++) { const c = prol.idx[q]; idx[fill[c]] = f; widx[fill[c]] = q; fill[c]++; }
  return { ptr, idx, widx };
}

/**
 * Galerkin operator K_c = P^T K P between a level and its coarse level, with
 * matrix weights W (b_f x b_c) per (fine, coarse) pair.
 */
function galerkinProduct(level) {
  const coarse = level.coarse, prol = level.prol, ch = coarse.children;
  const bf = level.b, bc = coarse.b, bfc = bf * bc, bcc = bc * bc, bff = bf * bf;
  const P = level.P, val = level.val, nnc = coarse.nn, W = prol.W;
  const mark = new Int32Array(nnc).fill(-1);
  const acc = new Float64Array(nnc * bcc);
  const touched = [];
  const rowPtr = new Int32Array(nnc + 1);
  const cols = [];
  const vals = [];
  const T = new Float64Array(bfc);
  for (let I = 0; I < nnc; I++) {
    touched.length = 0;
    for (let q = ch.ptr[I]; q < ch.ptr[I + 1]; q++) {
      const i = ch.idx[q], wi = ch.widx[q] * bfc;
      for (let k = P.rowPtr[i]; k < P.rowPtr[i + 1]; k++) {
        const j = P.col[k], v = bff * k;
        for (let p = prol.ptr[j]; p < prol.ptr[j + 1]; p++) {
          const J = prol.idx[p], wj = p * bfc;
          if (mark[J] !== I) { mark[J] = I; touched.push(J); acc.fill(0, bcc * J, bcc * J + bcc); }
          for (let r = 0; r < bf; r++) {
            const vr = v + r * bf;
            for (let c = 0; c < bc; c++) {
              let sum = 0;
              for (let t = 0; t < bf; t++) sum += val[vr + t] * W[wj + t * bc + c];
              T[r * bc + c] = sum;
            }
          }
          const a = bcc * J;
          for (let r = 0; r < bc; r++) for (let c = 0; c < bc; c++) {
            let sum = 0;
            for (let t = 0; t < bf; t++) sum += W[wi + t * bc + r] * T[t * bc + c];
            acc[a + r * bc + c] += sum;
          }
        }
      }
    }
    touched.sort((a, b) => a - b);
    rowPtr[I + 1] = rowPtr[I] + touched.length;
    for (const J of touched) { cols.push(J); for (let t = 0; t < bcc; t++) vals.push(acc[bcc * J + t]); }
  }
  const col = Int32Array.from(cols);
  const diag = new Int32Array(nnc);
  for (let I = 0; I < nnc; I++) for (let k = rowPtr[I]; k < rowPtr[I + 1]; k++) if (col[k] === I) { diag[I] = k; break; }
  coarse.P = { n: nnc, rowPtr, col, nb: col.length, diag };
  coarse.val = Float64Array.from(vals);
}

/** Parts whose elements are compliant layers that split a column into separate shell aggregates. */
const COMPLIANT_PARTS = new Set([PART.SOLDER, PART.UF_BUMP, PART.UF_FILLET, PART.TIM, PART.LIDADH, PART.STIFFADH]);

/**
 * Shell level from the solid level. Each column is cut into aggregates at
 * void gaps and at compliant layers (bump layer, underfill, TIM, adhesives), so
 * every stiff stack (substrate, die, lid plate with its foot, stiffener)
 * carries its own six rigid-body-plus-thickness modes; the interior nodes of a
 * compliant stack form aggregates of their own (a single node then only uses
 * its three translations, the other modes are void and factor with jitter).
 * The Jacobi scaling s of the fine system is folded into the weights
 * (x_scaled = S^-1 u).
 */
function buildShellLevel(level, s, mesh) {
  const nx = level.nx, ny = level.ny, nz = level.nz, ncy = ny - 1, ncz = nz - 1;
  const ncol = nx * ny;
  const colStartC = new Int32Array(ncol + 1);
  const nodeAgg = new Int32Array(level.nn).fill(-1);
  const zlo = [], zhi = [], zref = [], aggCol = [];
  let na = 0;
  const isCompliant = (i, j, k) => {
    if (!mesh) return false;
    const c = (i * ncy + j) * ncz + k;
    let any = false, stiff = false;
    for (let q = 0; q < 2; q++) {
      const e = mesh.cellElems[2 * c + q];
      if (e < 0) continue;
      any = true;
      if (!COMPLIANT_PARTS.has(mesh.ePart[e])) stiff = true;
    }
    return any && !stiff;
  };
  const hasElem = (i, j, k) => {
    if (!mesh) return true;
    return mesh.cellElems[2 * ((i * ncy + j) * ncz + k)] >= 0;
  };
  const elemClass = (i, j, k) => (k < 0 || k >= ncz || !hasElem(i, j, k)) ? 0 : (isCompliant(i, j, k) ? 1 : 2); // 0 none, 1 compliant, 2 stiff
  for (let c = 0; c < ncol; c++) {
    colStartC[c] = na;
    const i = Math.floor(c / ny), j = c % ny;
    // node type: stiff when touching a stiff element, else compliant (interior of a compliant stack)
    const runs = [];
    let cur = null, prevK = -2, prevType = 0;
    for (let k = 0; k < nz; k++) {
      const n = level.nodeId[c * nz + k];
      if (n < 0) { cur = null; prevK = -2; continue; }
      const below = elemClass(i, j, k - 1), above = elemClass(i, j, k);
      const type = (below === 2 || above === 2) ? 2 : 1;
      let joined = false;
      if (cur && prevK === k - 1 && below !== 0) joined = below === 2 || (type === 1 && prevType === 1);
      if (!joined) { cur = []; runs.push(cur); }
      cur.push({ n, k, z: level.coords[3 * n + 2] });
      prevK = k; prevType = type;
    }
    // optional merge of single-node compliant aggregates into a neighbour
    const merge = level.mergeSingles || 'none';
    if (merge !== 'none') {
      for (let r = 0; r < runs.length; r++) {
        if (runs[r].length !== 1 || runs.length < 2) continue;
        const t = merge === 'below' ? (r > 0 ? r - 1 : r + 1) : (r + 1 < runs.length ? r + 1 : r - 1);
        if (t < r) runs[t].push(runs[r][0]); else runs[t].unshift(runs[r][0]);
        runs.splice(r, 1); r--;
      }
    }
    for (const run of runs) {
      let zs = 0;
      for (const o of run) { nodeAgg[o.n] = na; zs += o.z; }
      zlo.push(run[0].z); zhi.push(run[run.length - 1].z); zref.push(zs / run.length); aggCol.push(c);
      na++;
    }
  }
  colStartC[ncol] = na;
  const coarse = {
    kind: 'shell', b: 6, nx, ny, xs: level.xs, ys: level.ys, nn: na, colStart: colStartC,
    zref: Float64Array.from(zref), zlo: Float64Array.from(zlo), zhi: Float64Array.from(zhi),
    keepX: level.keepX, keepY: level.keepY,
  };
  level.coarse = coarse;
  level.nodeAgg = nodeAgg;
  shellWeights(level, s);
  coarse.children = transposeProl(level.prol, na);
  galerkinProduct(level);
  return coarse;
}

/** Prolongation weights (3 x 6 per node) of the solid -> shell transfer. */
function shellWeights(level, s) {
  const nn = level.nn, nodeAgg = level.nodeAgg, zref = level.coarse.zref;
  const ptr = new Int32Array(nn + 1), idx = new Int32Array(nn), W = new Float64Array(nn * 18);
  for (let n = 0; n < nn; n++) {
    ptr[n + 1] = n + 1; idx[n] = nodeAgg[n];
    const zp = level.coords[3 * n + 2] - zref[nodeAgg[n]];
    const o = 18 * n;
    W[o] = 1 / s[3 * n]; W[o + 4] = zp / s[3 * n];
    W[o + 7] = 1 / s[3 * n + 1]; W[o + 9] = -zp / s[3 * n + 1];
    W[o + 14] = 1 / s[3 * n + 2]; W[o + 17] = zp / s[3 * n + 2];
  }
  level.prol = { ptr, idx, W };
}

/** 6x6 Hermite / linear interpolation matrices between two shell aggregates along x or y. */
function hermitePair(t, h, alongY, WA, WB) {
  WA.fill(0); WB.fill(0);
  for (let d = 0; d < 6; d++) { WA[d * 6 + d] = 1 - t; WB[d * 6 + d] = t; }
  const h00 = 2 * t * t * t - 3 * t * t + 1, h10 = t * t * t - 2 * t * t + t, h01 = -2 * t * t * t + 3 * t * t, h11 = t * t * t - t * t;
  WA[2 * 6 + 2] = h00; WB[2 * 6 + 2] = h01;
  if (alongY) { WA[2 * 6 + 3] = h * h10; WB[2 * 6 + 3] = h * h11; }     // dw/dy = +theta_x
  else { WA[2 * 6 + 4] = -h * h10; WB[2 * 6 + 4] = -h * h11; }          // dw/dx = -theta_y
}

/** Multigrid preconditioner: solid level, shell levels, dense coarsest. */
class MultigridPC {
  constructor(mesh, P, val, s, opts) {

    this.opts = Object.assign({ pre: 2, post: 2, symmetric: false }, opts || {});

/** Scalar upper CSR (sorted columns) from the full block pattern. */
function scalarUpperCSR(P, val) {
  const n = 3 * P.n;
  const rowPtr = new Int32Array(n + 1);
  for (let i = 0; i < P.n; i++) for (let p = 0; p < 3; p++) {
    let c = 0;

  }
  const col = new Int32Array(rowPtr[n]), v = new Float64Array(rowPtr[n]);
  for (let i = 0; i < P.n; i++) for (let p = 0; p < 3; p++) {
    let w = rowPtr[3 * i + p];
    for (let k = P.rowPtr[i]; k < P.rowPtr[i + 1]; k++) {
      const j = P.col[k];
      if (j < i) continue;
      for (let q = (j === i ? p : 0); q < 3; q++) { col[w] = 3 * j + q; v[w] = val[9 * k + 3 * p + q]; w++; }
