# Builds the Windows desktop app (installer and portable .exe) from the committed page in dist/.
# Run it from the Actions tab (Run workflow), or push a tag named desktop-v* to also attach the
# files to a GitHub release. The built files are kept as the run's "fcbga-desktop-windows" artifact.
name: Desktop app (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build the installer and the portable app
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'  # no code-signing certificate: the app is unsigned
      - name: Check the compute process runs the page's code (plain Node, full Draft analysis on 2 helper threads)
        run: node ../tools/desktop-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fcbga-desktop-windows
          path: |
            desktop/release/*.exe
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
